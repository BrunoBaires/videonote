<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incertis · Video Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Archivo+Narrow:wght@600;700&family=Bebas+Neue&family=Anton&family=Playfair+Display:wght@600;700;800&family=Roboto+Condensed:wght@500;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f2f4f7; --line:#dce0e6;
  --ink:#1a1d22; --dim:#6b7280; --rojo:#D60019; --field:#f6f7f9;
  --ui:"Franklin Gothic Book","Franklin Gothic","Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Franklin Gothic Medium","Franklin Gothic Demi","Helvetica Neue",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);min-height:100vh;padding:22px 18px 50px}

header{max-width:1560px;margin:0 auto 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--disp);font-weight:600;font-size:24px;letter-spacing:.05em;text-transform:uppercase}
h1 span{color:var(--rojo)}
header p{color:var(--dim);font-size:12px;line-height:1.5;max-width:400px}

.wrap{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:290px 1fr 300px;gap:20px;align-items:start}
@media(max-width:1200px){.wrap{grid-template-columns:270px 1fr}}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

.col{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card > .body{padding:15px}

.head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;cursor:pointer;user-select:none}
.head:hover{background:var(--panel2)}
.head h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:400}
.head .arrow{color:var(--dim);font-size:10px;transition:transform .18s}
.card.open .head .arrow{transform:rotate(90deg)}
.card .body.collapsible{display:none;padding:0 15px 15px}
.card.open .body.collapsible{display:block}

.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.val{font-family:var(--mono);font-size:10.5px;color:var(--dim);float:right;text-transform:none;letter-spacing:0}
.grp{margin-bottom:15px}
.grp:last-child{margin-bottom:0}

input[type=text],input[type=password],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{outline:none;border-color:var(--rojo)}
textarea{resize:vertical;min-height:36px;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--rojo);margin:2px 0}
input[type=color]{width:100%;height:32px;background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;margin-top:7px}
.chk input{accent-color:var(--rojo);width:15px;height:15px;cursor:pointer}

.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px 12px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--rojo);background:#fdeef0}
.drop strong{display:block;font-size:12.5px;margin-bottom:4px}
.drop small{color:var(--dim);font-size:10.5px}

.swatches{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sw{width:25px;height:25px;border-radius:5px;border:1px solid var(--line);cursor:pointer}
.sw:hover{border-color:var(--ink)}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:13px;position:sticky;top:16px}
canvas{max-width:100%;max-height:62vh;border-radius:8px;background:#e6e9ee;display:block}
.bar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;width:100%}
button{font-family:var(--disp);font-weight:500;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}
button.rec{background:var(--rojo);border-color:var(--rojo)}
button.rec:hover:not(:disabled){background:#b0000f}
.mini-btn{width:100%;margin-top:7px;padding:6px;font-size:10.5px;letter-spacing:.05em}

.status{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;line-height:1.6;min-height:28px;padding:0 8px}
.status.err{color:#c0182b}
.status.ok{color:#1a7f46}
.prog{width:100%;height:3px;background:var(--field);border-radius:2px;overflow:hidden;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;background:var(--rojo);width:0;transition:width .2s}
.dl{display:none;width:100%;text-align:center}
.dl.on{display:block}
.dl-link{display:inline-block;font-family:var(--disp);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:6px;background:var(--field);border:1px solid var(--rojo);color:var(--ink);text-decoration:none}
.dl-link:hover{background:var(--rojo)}
.note{font-size:10.5px;color:var(--dim);line-height:1.55;margin-top:8px}
.hint{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:6px;font-style:italic}
video.src{display:none}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate.off{display:none}
.gate-box{width:100%;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;text-align:center}
.gate-sub{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.gate-box input{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:11px 12px;font-family:inherit;font-size:14px;text-align:center}
.gate-box input:focus{outline:none;border-color:var(--rojo)}
.gate-err{font-family:var(--mono);font-size:10.5px;color:#c0182b;min-height:16px;margin-top:10px}
.reset{font-family:var(--mono);font-size:9.5px;color:var(--dim);cursor:pointer;text-decoration:underline;margin-top:7px;display:inline-block}
.reset:hover{color:var(--ink)}

/* ---------- generador de fondo con IA + zócalo ---------- */
.counter{float:right;font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:none;letter-spacing:0}
.gen{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}
.gen.on{display:block}
.gen input[type=password]{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font-family:inherit;font-size:13px}
.gen input[type=password]:focus{outline:none;border-color:var(--rojo)}
.gen textarea{min-height:52px}
.genbtn{width:100%;margin-top:10px;padding:9px;font-size:11px}
.genbtn.go{background:var(--rojo);border-color:var(--rojo)}
.genbtn.go:hover:not(:disabled){background:#b0000f}
.genstat{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.5;margin-top:9px;min-height:14px}
.genstat.err{color:#c0182b}
.genstat.ok{color:#1a7f46}
.genprev{margin-top:11px;display:none;flex-direction:column;gap:8px}
.genprev.on{display:flex}
.genhist{display:flex;gap:6px;flex-wrap:wrap}
.genhist img{width:42px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer;opacity:.6}
.genhist img.sel{border-color:var(--rojo);opacity:1}
.genrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--rojo);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- pestañas ---------- */
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:9px 22px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.tab:hover:not(.on){color:var(--ink)}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--rojo);box-shadow:inset 0 -2px 0 var(--rojo)}
</style>
</head>
<body>

<!--
  NOTA DE INTEGRACIÓN
  ===================
  Este archivo en el repo contiene la cáscara (estilos + estructura base).
  El cuerpo completo del editor (paneles Video/Fondos, lienzo, script de render,
  IA de fondos, transcripción, etc.) es la versión de trabajo que vive en el
  proyecto de Claude como fuente de verdad. Antes de conectar a Vercel para el
  render en servidor, reemplazar este cuerpo por la última versión del editor.
-->

<div class="gate" id="gate">
  <div class="gate-box">
    <h1 style="margin-bottom:6px">Incertis · <span>Video Note</span></h1>
    <p class="gate-sub">Acceso para la redacción</p>
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
    <button id="enter" style="width:100%;margin-top:10px">Entrar</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>Incertis · <span>Video Note</span></h1>
    <p>Editor de escritorio. Versión de trabajo en el proyecto.</p>
  </header>
</div>

<script type="module">
const CLAVE = 'incertis2026';
const gate = document.getElementById('gate');
const app = document.getElementById('app');
function abrir(){ gate.classList.add('off'); app.hidden = false; try{ localStorage.setItem('vn_ok','1'); }catch(e){} }
function intentar(){
  const v = document.getElementById('pass').value.trim();
  if(v === CLAVE) abrir();
  else { document.getElementById('gateErr').textContent = 'Contraseña incorrecta.'; document.getElementById('pass').value=''; document.getElementById('pass').focus(); }
}
document.getElementById('enter').addEventListener('click', intentar);
document.getElementById('pass').addEventListener('keydown', e => { if(e.key === 'Enter') intentar(); });
try{ if(localStorage.getItem('vn_ok') === '1') abrir(); else document.getElementById('pass').focus(); }
catch(e){ document.getElementById('pass').focus(); }
</script>
</body>
</html>
