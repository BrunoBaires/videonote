<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incertis · Opinión Interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f2f4f7; --line:#dce0e6;
  --ink:#1a1d22; --dim:#6b7280; --rojo:#D60019; --field:#f6f7f9;
  --ok:#0f7a52; --no:#a11d2e;
  --ui:"Franklin Gothic Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Franklin Gothic Medium","Helvetica Neue",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);min-height:100vh;overscroll-behavior-x:contain}

header{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
h1{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
h1 span{color:var(--rojo)}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.tab:hover:not(.on){color:var(--ink)}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--rojo);box-shadow:inset 0 -2px 0 var(--rojo)}

.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card .body{padding:18px}
.card h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:400;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:4px}

.empty{padding:60px 24px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.empty a{color:var(--rojo);font-weight:600;text-decoration:none}
.empty a:hover{text-decoration:underline}

video{width:100%;border-radius:8px;background:#000;display:block}
.videoWrap{position:relative}
.caption{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;
  font-family:var(--ui);font-weight:600;font-size:clamp(13px,2.4vw,20px);line-height:1.35;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.5);
  pointer-events:none;white-space:pre-wrap}

.reactRow{display:flex;justify-content:space-between;align-items:center;margin-top:18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.reactRow .no{color:var(--no)}
.reactRow .yes{color:var(--ok)}
.reactRow .neu{color:var(--dim)}

.slider{position:relative;height:34px;margin-top:8px;border-radius:17px;
  background:linear-gradient(90deg, var(--no), var(--panel2) 50%, var(--ok));
  border:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.slider:active{cursor:grabbing}
.slider .thumb{position:absolute;top:4px;left:50%;width:26px;height:26px;margin-left:-13px;
  border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25);
  pointer-events:none}

.statLine{text-align:center;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.statLine b{color:var(--ink)}

canvas{width:100%;display:block;border-radius:6px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini-btn{font-family:var(--ui);font-size:12px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);cursor:pointer}
.mini-btn:hover{background:var(--field)}
.mini-btn:disabled{opacity:.5;cursor:not-allowed}

.segList{margin-top:10px;max-height:200px;overflow:auto;font-size:12.5px}
.segRow{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.segRow .t{font-family:var(--mono);color:var(--dim);flex:0 0 auto;white-space:nowrap}
.segRow .x{color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>Incertis · <span>Opinión Interactiva</span></h1>
  <div class="tabs">
    <button type="button" class="tab" data-tab="video">Video</button>
    <button type="button" class="tab" data-tab="fondos">Fondos</button>
    <button type="button" class="tab" data-tab="audio">AudioNote</button>
    <button type="button" class="tab on" data-tab="oi">Opinión Interactiva</button>
  </div>
</header>

<div class="wrap" id="wrap">
  <!-- Se completa por JS: o el mensaje de "no hay nada" o el reproductor -->
</div>

<script>
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const which=t.dataset.tab;
  if(which==='video'){ window.location.href='index.html'; }
  else if(which==='fondos'){ window.location.href='index.html#fondos'; }
  else if(which==='audio'){ window.location.href='audionote.html'; }
}));

const $ = (id) => document.getElementById(id);
const wrap = $('wrap');

window.addEventListener('error', (e) => {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a11d2e;color:#fff;padding:10px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;z-index:9999;white-space:pre-wrap';
  bar.textContent = 'Error en Opinión Interactiva: ' + (e.message || (e.error && e.error.message) || e.error);
  document.body.prepend(bar);
});

function fmtT(s){
  s = Math.max(0, s||0);
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('vnHandoff', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('oi'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function loadHandoff(){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('oi', 'readonly');
    const req = tx.objectStore('oi').get('current');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}

function renderEmpty(){
  wrap.innerHTML = `
    <div class="card"><div class="body">
      <div class="empty">
        No hay ningún video esperando acá todavía.<br><br>
        Andá a <a href="index.html">Video Note</a>, transcribí un video y usá el botón
        <b>"Enviar a Opinión Interactiva →"</b> en la card de Transcripción.
      </div>
    </div></div>`;
}

function renderPlayer(entry){
  const { videoBlob, payload } = entry;
  const videoUrl = URL.createObjectURL(videoBlob);
  const segs = (payload && payload.segments) || [];

  wrap.innerHTML = `
    <div class="card"><div class="body">
      <div class="videoWrap">
        <video id="oiVid" playsinline controls src="${videoUrl}"></video>
        <div class="caption" id="oiCaption"></div>
      </div>
      <div class="reactRow">
        <span class="no">No me gusta</span>
        <span class="neu">Neutral</span>
        <span class="yes">Me gusta</span>
      </div>
      <div class="slider" id="oiSlider">
        <div class="thumb" id="oiThumb"></div>
      </div>
      <div class="statLine">Reacción actual: <b id="oiVal">0</b></div>
      <div class="hint">Arrastrá el control con el mouse o el dedo mientras el video reproduce. Al soltar, vuelve solo a neutral.</div>
    </div></div>

    <div class="card"><div class="body">
      <h2>Curva de reacción</h2>
      <div class="hint" style="margin-bottom:8px">Verde = aprobación, rojo = rechazo. Se arma en vivo mientras mirás el video.</div>
      <canvas id="oiCanvas" width="760" height="220"></canvas>
      <div class="axis"><span>0:00</span><span id="oiDurLbl">0:00</span></div>
      <div class="actions">
        <button type="button" class="mini-btn" id="oiReset">↺ Reiniciar curva</button>
        <button type="button" class="mini-btn" id="oiExport">Descargar curva (.json)</button>
      </div>
    </div></div>

    ${segs.length ? `
    <div class="card"><div class="body">
      <h2>Transcripción del fragmento</h2>
      <div class="segList" id="oiSegs"></div>
    </div></div>` : ''}
  `;

  const vid = $('oiVid');
  const caption = $('oiCaption');
  const track = $('oiSlider');
  const thumb = $('oiThumb');
  const valLbl = $('oiVal');
  const canvas = $('oiCanvas');
  const ctx = canvas.getContext('2d');
  const durLbl = $('oiDurLbl');

  // subtítulo superpuesto, sincronizado con currentTime (usa el mismo texto
  // ya traducido que arma "Transcripción del fragmento")
  let capIdx = -1;
  vid.addEventListener('timeupdate', () => {
    if (!segs.length) return;
    const t = vid.currentTime;
    let idx = segs.findIndex(s => t >= s.start && t < s.end);
    if (idx !== capIdx) {
      capIdx = idx;
      caption.textContent = idx >= 0 ? segs[idx].text : '';
    }
  });
  vid.addEventListener('seeked', () => { capIdx = -1; });

  let duration = (payload && payload.duration_seconds) || 0;
  let curve = []; // [{t, v}] muestreada mientras reproduce
  let value = 0;  // -100..100
  let dragging = false;
  let releaseRaf = null;

  vid.addEventListener('loadedmetadata', () => {
    duration = vid.duration || duration;
    durLbl.textContent = fmtT(duration);
    drawCurve();
  });

  function applyThumb(){
    const pct = (value + 100) / 200; // 0..1
    thumb.style.left = (pct * 100) + '%';
    valLbl.textContent = Math.round(value);
  }
  function setVal(v){
    value = Math.max(-100, Math.min(100, v));
    applyThumb();
  }
  function valueFromClientX(clientX){
    const r = track.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    return Math.round(pct * 200 - 100);
  }
  function snapToNeutral(){
    if (releaseRaf) cancelAnimationFrame(releaseRaf);
    const start = value;
    const t0 = performance.now();
    const DUR = 220; // ms, mismo criterio que el prototipo original (RF-13)
    function step(now){
      const p = Math.min(1, (now - t0) / DUR);
      setVal(start * (1 - p));
      if (p < 1) releaseRaf = requestAnimationFrame(step);
    }
    releaseRaf = requestAnimationFrame(step);
  }

  track.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragging = true;
    track.setPointerCapture(e.pointerId);
    setVal(valueFromClientX(e.clientX));
  });
  track.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    setVal(valueFromClientX(e.clientX));
  });
  function release(){
    if (!dragging) return;
    dragging = false;
    snapToNeutral();
  }
  track.addEventListener('pointerup', release);
  track.addEventListener('pointercancel', release);
  applyThumb();

  let sampleTimer = null;
  vid.addEventListener('play', () => {
    if (sampleTimer) clearInterval(sampleTimer);
    sampleTimer = setInterval(() => {
      if (vid.paused || vid.ended) return;
      curve.push({ t: vid.currentTime, v: value });
      drawCurve();
    }, 120);
  });
  vid.addEventListener('pause', () => { if (sampleTimer) clearInterval(sampleTimer); });
  vid.addEventListener('ended', () => { if (sampleTimer) clearInterval(sampleTimer); });

  function drawCurve(){
    const W = canvas.width, H = canvas.height, MID = H/2;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = '#dce0e6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, MID); ctx.lineTo(W, MID); ctx.stroke();
    if (curve.length < 2 || !duration){ return; }

    const okGrad = ctx.createLinearGradient(0, 0, 0, MID);
    okGrad.addColorStop(0, 'rgba(15,122,82,.85)');
    okGrad.addColorStop(1, 'rgba(15,122,82,.15)');
    const noGrad = ctx.createLinearGradient(0, MID, 0, H);
    noGrad.addColorStop(0, 'rgba(161,29,46,.15)');
    noGrad.addColorStop(1, 'rgba(161,29,46,.85)');

    const pts = curve.map(p => ({ x: (p.t/duration) * W, y: MID - (p.v/100) * MID }));

    // relleno por tramos de signo (para que el gradiente verde/rojo quede prolijo)
    let i = 0;
    while (i < pts.length - 1) {
      let j = i;
      const sign = Math.sign(pts[i].y - MID) || 0;
      while (j < pts.length - 1 && (Math.sign(pts[j+1].y - MID) || sign) === sign) j++;
      const seg = pts.slice(i, j+1);
      if (seg.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(seg[0].x, MID);
        seg.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(seg[seg.length-1].x, MID);
        ctx.closePath();
        ctx.fillStyle = sign < 0 ? okGrad : (sign > 0 ? noGrad : 'transparent');
        ctx.fill();
      }
      i = (j > i) ? j : i + 1; // garantiza que siempre avance, sin esto podía quedar en loop infinito
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p,idx) => idx===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.stroke();
  }

  $('oiReset').onclick = () => { curve = []; drawCurve(); };
  $('oiExport').onclick = () => {
    const blob = new Blob([JSON.stringify({ video_id: payload && payload.video_id, curve }, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'curva-reaccion.json'; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  };

  if (segs.length) {
    $('oiSegs').innerHTML = segs.map(s =>
      `<div class="segRow"><span class="t">${fmtT(s.start)}–${fmtT(s.end)}</span><span class="x">${s.text}</span></div>`
    ).join('');
  }
}

function renderError(err){
  wrap.innerHTML = `
    <div class="card"><div class="body">
      <div class="empty" style="color:#a11d2e;text-align:left">
        <b>Se rompió algo al armar la página.</b><br><br>
        Mandale esto a Claude tal cual (captura o copiado):<br><br>
        <code style="display:block;background:var(--field);padding:10px;border-radius:6px;margin-top:6px;white-space:pre-wrap;font-family:var(--mono);font-size:11.5px">${String((err && err.stack) || err)}</code>
      </div>
    </div></div>`;
}

loadHandoff().then(entry => {
  if (!entry || !entry.videoBlob) { renderEmpty(); return; }
  try {
    renderPlayer(entry);
  } catch (err) {
    renderError(err);
  }
}).catch(err => renderError(err));
</script>
</body>
</html>
