<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incertis · Opinión Interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f2f4f7; --line:#dce0e6;
  --ink:#1a1d22; --dim:#6b7280; --rojo:#D60019; --field:#f6f7f9;
  --ok:#0f7a52; --no:#a11d2e;
  --ui:"Franklin Gothic Book","Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Franklin Gothic Medium","Helvetica Neue",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);min-height:100vh;overscroll-behavior-x:contain}
input,textarea,select,button{font-size:16px}

header{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
h1{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
h1 span{color:var(--rojo)}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.tab:hover:not(.on){color:var(--ink)}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--rojo);box-shadow:inset 0 -2px 0 var(--rojo)}

.wrap{max-width:820px;margin:0 auto;padding:10px 18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card .body{padding:18px}
.card h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:400;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:4px}

.empty{padding:60px 24px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.empty a{color:var(--rojo);font-weight:600;text-decoration:none}
.empty a:hover{text-decoration:underline}

video{width:auto;max-width:100%;max-height:26vh;display:block;margin:0 auto;border-radius:8px;background:#000}
.videoRow.expanded video{max-height:70vh}
.videoWrap{position:relative}
.caption{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;
  font-family:var(--ui);font-weight:600;font-size:clamp(11px,2.4vw,15px);line-height:1.3;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.5);
  pointer-events:none;white-space:pre-wrap}

.reactRow{display:flex;justify-content:space-between;align-items:center;margin-top:18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.reactRow .no{color:var(--no)}
.reactRow .yes{color:var(--ok)}
.reactRow .neu{color:var(--dim)}

.tapRow{display:flex;gap:12px;margin-top:10px}
.tapBtn{flex:1;padding:22px 12px;border-radius:12px;border:none;font-family:var(--disp);
  font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
  color:#fff;transition:transform .08s}
.tapBtn:active{transform:scale(0.96)}
.tapBtn-neg{background:var(--no)}
.tapBtn-pos{background:var(--ok)}

.statLine{text-align:center;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.statLine b{color:var(--ink)}

canvas{width:100%;display:block;border-radius:6px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}

.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini-btn{font-family:var(--ui);font-size:12px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);cursor:pointer}
.mini-btn:hover{background:var(--field)}
.mini-btn:disabled{opacity:.5;cursor:not-allowed}

.segList{margin-top:10px;max-height:240px;overflow:auto;font-size:12.5px}
.segRow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.segRow:hover{background:var(--field)}
.segRow .t{font-family:var(--mono);color:var(--dim);flex:0 0 auto;white-space:nowrap;font-size:11px}
.segRow .x{color:var(--ink);flex:1}
.segBadge{flex:0 0 auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.segBadge-ok{background:#eaf5ef;color:var(--ok)}
.segBadge-no{background:#fbeced;color:var(--no)}
.segBadge-none{background:var(--field);color:var(--dim);font-weight:400}

/* Video chico, SIEMPRE fijo arriba — fixed, no sticky, para que no dependa de layout */
.videoRow{position:sticky;top:8px;z-index:60;
  display:flex;flex-direction:column;width:100%;
  background:var(--panel);padding:8px;border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  max-height:50vh;overflow-y:auto}
.videoRow.expanded{max-height:none;overflow-y:visible}
.videoRow .videoWrap{flex:1;min-width:0}
.expandBtnRow{display:flex;margin-bottom:4px}
.vu{display:flex;gap:6px;flex:0 0 auto}
.vuCol{display:flex;flex-direction:column;align-items:center;gap:4px;width:24px}
.vuPct{font-family:var(--mono);font-size:9.5px;color:var(--dim);font-weight:600}
.vuTrack{flex:1;width:100%;min-height:56px;background:var(--field);border-radius:6px;
  display:flex;align-items:flex-end;overflow:hidden}
.vuFill{width:100%;height:0%;transition:height .09s linear;border-radius:6px}
.vuFill-neg{background:var(--no)}
.vuFill-pos{background:var(--ok)}

.cumWrap{display:none;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.cumWrap.on{display:flex}
.cumTag{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.cumPct{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1;color:#d6493a}
.cumLabel{font-family:var(--ui);font-size:10.5px;font-weight:600;color:var(--dim)}
.cumBarTrack{width:26px;height:80px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--field);margin-top:4px}
.cumBarNeg{width:100%;height:50%;background:#d6493a;transition:height .3s}
.cumBarPos{width:100%;height:50%;background:#7ed957;transition:height .3s}
.cumVotes{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap}

.voted{display:none;text-align:center;padding:16px 0}
.voted.on{display:block}

.modeToggle{display:flex;gap:8px;margin-bottom:10px}
.modeBtn{flex:1;font-family:var(--ui);font-size:12.5px;padding:9px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.modeBtn.on{background:var(--panel);color:var(--ink);border-color:var(--rojo);font-weight:600}

.report{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.report summary{padding:10px 12px;font-family:var(--ui);font-size:13px;font-weight:600;cursor:pointer;
  list-style:none;display:flex;justify-content:space-between;align-items:center;background:var(--panel2)}
.report summary::-webkit-details-marker{display:none}
.report .body{padding:12px;font-size:13.5px;line-height:1.65;color:var(--ink)}
.report a{color:var(--rojo);text-decoration:none;font-weight:600}
.report a:hover{text-decoration:underline}

.question{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

.recRow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.recDot{width:8px;height:8px;border-radius:50%;background:var(--no);display:none}
.recDot.on{display:inline-block;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <!-- Se completa por JS: o el mensaje de "no hay nada" o el reproductor -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const wrap = $('wrap');

window.addEventListener('error', (e) => {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a11d2e;color:#fff;padding:10px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;z-index:9999;white-space:pre-wrap';
  bar.textContent = 'Error en Opinión Interactiva: ' + (e.message || (e.error && e.error.message) || e.error);
  document.body.prepend(bar);
});

function fmtT(s){
  s = Math.max(0, s||0);
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('vnHandoff', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('oi'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function loadHandoff(){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('oi', 'readonly');
    const req = tx.objectStore('oi').get('current');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}

function aaiGet(){ try{ return localStorage.getItem('vn_aai')||''; }catch(e){ return ''; } }
function aaiSet(v){ try{ if(v) localStorage.setItem('vn_aai', v); else localStorage.removeItem('vn_aai'); }catch(e){} }
function oaiGet(){ try{ return localStorage.getItem('vn_oai')||''; }catch(e){ return ''; } }
function oaiSet(v){ try{ if(v) localStorage.setItem('vn_oai', v); else localStorage.removeItem('vn_oai'); }catch(e){} }

async function gptChatSetup(messages, opts){
  const key = oaiGet();
  if (!key) throw new Error('Falta la clave de OpenAI.');
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + key, 'content-type': 'application/json' },
    body: JSON.stringify({ model: (opts && opts.model) || 'gpt-4o', temperature: (opts && opts.temperature != null) ? opts.temperature : 0.4, messages }),
  });
  if (!r.ok) { let m=''; try{ const j=await r.json(); m=(j.error&&j.error.message)||''; }catch(e){} throw new Error('OpenAI ' + r.status + (m ? ' · ' + m : '')); }
  const d = await r.json();
  return (d.choices[0].message.content || '').trim();
}

function buildCues(words){
  const cues=[]; if(!words||!words.length) return cues;
  const MAXW=9, MAXC=56, GAP=650;
  let cur=null;
  for(const w of words){
    const tx=(w.text||'').trim(); if(!tx) continue;
    if(cur){
      const gap=w.start-cur.endRaw;
      const nextLen=cur.text.length+1+tx.length;
      const endsSent=/[.?!…:]$/.test(cur.lastWord);
      if(cur.n>=MAXW || nextLen>MAXC || gap>GAP || endsSent){ cues.push(cur); cur=null; }
    }
    if(!cur) cur={start:w.start, endRaw:w.end, text:tx, n:1, lastWord:tx};
    else { cur.text+=' '+tx; cur.endRaw=w.end; cur.n++; cur.lastWord=tx; }
  }
  if(cur) cues.push(cur);
  for(let i=0;i<cues.length;i++){
    cues[i].end = (i<cues.length-1) ? Math.min(cues[i+1].start, cues[i].endRaw+1200) : cues[i].endRaw+900;
  }
  return cues;
}

function parseJsonArray(s){
  if(!s) return null;
  let t=s.replace(/```json|```/gi,'').trim();
  try{ const a=JSON.parse(t); return Array.isArray(a)?a:null; }catch(e){}
  const i=t.indexOf('['), j=t.lastIndexOf(']');
  if(i>=0 && j>i){ try{ const a=JSON.parse(t.slice(i,j+1)); return Array.isArray(a)?a:null; }catch(e){} }
  return null;
}
const SUB_TR_SYS =
  'Sos traductor de subtítulos periodísticos al español rioplatense (Argentina): natural, claro y fiel al sentido, registro de noticiero.\n'+
  'Te paso un array JSON de N segmentos consecutivos de habla continua.\n'+
  'Devolvé SOLO un array JSON con EXACTAMENTE N elementos, en el mismo orden, donde el elemento i es la traducción del segmento i.\n'+
  'No repitas texto entre segmentos, no fusiones ni dividas segmentos.';
async function translateBatch(lines, ctxPrev, ctxNext){
  const N=lines.length;
  const ctxMsg=(ctxPrev||ctxNext)
    ? [{role:'system', content:'Contexto (NO traducir, sólo para continuidad). Antes: «'+(ctxPrev||'—')+'». Después: «'+(ctxNext||'—')+'».'}]
    : [];
  const ask=async (temp)=>{
    const out=await gptChatSetup([{role:'system',content:SUB_TR_SYS}, ...ctxMsg, {role:'user',content:JSON.stringify(lines)}], {model:'gpt-4o', temperature:temp});
    return parseJsonArray(out);
  };
  let arr=await ask(0.2);
  if(arr && arr.length===N) return arr.map(x=>String(x==null?'':x));
  arr=await ask(0);
  if(arr && arr.length===N) return arr.map(x=>String(x==null?'':x));
  return null;
}

function renderEmpty(){
  wrap.innerHTML = `
    <div class="card"><div class="body">
      <div class="hint">Subí un video o pegá un link de X, transcribilo y arrancá directo acá — sin pasar por Video Note. (Si ya lo enviaste desde ahí, esto no debería aparecer.)</div>

      <div style="margin-top:14px">
        <input type="file" id="stFile" accept="video/*,audio/*" style="display:block;margin-bottom:8px">
        <div style="display:flex;gap:8px;margin-bottom:6px">
          <input type="text" id="stXUrl" placeholder="…o pegá un link de un posteo de X" style="flex:1;font-family:var(--ui);padding:8px;border:1px solid var(--line);border-radius:6px">
          <button type="button" class="mini-btn" id="stXBtn" style="margin-top:0">Traer video</button>
        </div>
        <div class="genstat" id="stFileStat"></div>
      </div>

      <div id="stKeys" style="margin-top:14px;display:none">
        <div class="hint" style="margin-bottom:6px">Claves de API (se guardan en este navegador; si ya las cargaste en Video Note, ya están acá)</div>
        <input type="text" id="stAaiKey" placeholder="AssemblyAI API key" style="width:100%;margin-bottom:6px;font-family:var(--ui);padding:8px;border:1px solid var(--line);border-radius:6px">
        <input type="text" id="stOaiKey" placeholder="OpenAI API key (para traducir)" style="width:100%;font-family:var(--ui);padding:8px;border:1px solid var(--line);border-radius:6px">
      </div>

      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="mini-btn" id="stTranscribe" style="margin-top:0" disabled>Transcribir</button>
        <button type="button" class="mini-btn" id="stTranslate" style="margin-top:0" disabled>Traducir al español</button>
        <button type="button" class="mini-btn" id="stGo" style="margin-top:0" disabled>Continuar →</button>
      </div>
      <div class="genstat" id="stStat" style="margin-top:8px"></div>
    </div></div>`;

  const aai = aaiGet(), oai = oaiGet();
  if (!aai || !oai) $('stKeys').style.display = 'block';
  if (aai) $('stAaiKey').value = aai;
  if (oai) $('stOaiKey').value = oai;
  $('stAaiKey').addEventListener('change', () => aaiSet($('stAaiKey').value.trim()));
  $('stOaiKey').addEventListener('change', () => oaiSet($('stOaiKey').value.trim()));

  let stFile = null, stSubWords = [], stSubCues = [], stDuration = 0;
  function stStat(t,c){ $('stStat').innerHTML=t; $('stStat').className='genstat'+(c?' '+c:''); }
  function fileReady(f){
    stFile = f;
    $('stFileStat').textContent = f.name + ' (' + (f.size/1048576).toFixed(1) + ' MB)';
    $('stTranscribe').disabled = false;
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => { stDuration = v.duration || 0; URL.revokeObjectURL(v.src); };
    v.src = URL.createObjectURL(f);
  }
  $('stFile').addEventListener('change', () => { if ($('stFile').files[0]) fileReady($('stFile').files[0]); });

  const XCHUNK = 6*1024*1024;
  async function xTrozo(url, desde, hasta){
    const ctl = new AbortController();
    const reloj = setTimeout(() => ctl.abort(), 50000);
    try { return await fetch('/api/xvideo?download=1&url='+encodeURIComponent(url), { headers:{ 'Range':'bytes='+desde+'-'+hasta }, signal: ctl.signal }); }
    finally { clearTimeout(reloj); }
  }
  async function intentarTraerX(url){
    const partes=[]; let desde=0, total=null, vueltas=0;
    while(total===null || desde<total){
      if(++vueltas>400) throw new Error('demasiados trozos');
      const r = await xTrozo(url, desde, desde+XCHUNK-1);
      if(!r.ok && r.status!==206){ let m=''; try{ const j=await r.json(); m=j.error||''; }catch(e){} throw new Error(m||('HTTP '+r.status)); }
      const cr = r.headers.get('content-range');
      if(cr){ const t=parseInt(cr.split('/')[1],10); if(isFinite(t)) total=t; }
      const b = await r.blob();
      if(!b.size) break;
      partes.push(b); desde+=b.size;
      if(r.status!==206){ total=desde; break; }
      stStat('<span class="spin"></span>Bajando… '+(desde/1048576).toFixed(1)+(total?(' de '+(total/1048576).toFixed(1)):'')+' MB');
    }
    const blob = new Blob(partes,{type:'video/mp4'});
    if(blob.size<1000) throw new Error('el archivo vino vacío');
    return blob;
  }
  $('stXBtn').addEventListener('click', async () => {
    const url = ($('stXUrl').value||'').trim();
    if (!url) { stStat('Pegá el link del posteo de X.','err'); return; }
    $('stXBtn').disabled = true;
    const INTENTOS = 3;
    let ultimoError = null;
    for (let intento = 1; intento <= INTENTOS; intento++){
      try{
        stStat('<span class="spin"></span>Buscando el video…' + (intento>1 ? ' (intento '+intento+' de '+INTENTOS+')' : ''));
        const blob = await intentarTraerX(url);
        const file = new File([blob], 'x-'+Date.now()+'.mp4', {type:'video/mp4'});
        stStat('Video traído ✓ ('+(blob.size/1048576).toFixed(1)+' MB).','ok');
        fileReady(file);
        ultimoError = null;
        break;
      }catch(e){
        ultimoError = e;
        if (intento < INTENTOS) await new Promise(r => setTimeout(r, 1200));
      }
    }
    if (ultimoError) {
      let msg=(ultimoError&&ultimoError.name==='AbortError') ? 'el servidor tardó demasiado en responder' : ((ultimoError&&ultimoError.message)||ultimoError);
      if(/Failed to fetch|NetworkError|load failed/i.test(String(msg)))
        msg='el endpoint de X está fallando ahora (es un servicio no oficial de X, se corta al azar) — probá de nuevo en un rato, o subí el archivo directamente con "Seleccionar archivo"';
      stStat('No se pudo traer el video después de '+INTENTOS+' intentos: '+msg+'.','err');
    }
    $('stXBtn').disabled = false;
  });

  $('stTranscribe').addEventListener('click', async () => {
    const key = aaiGet();
    if (!key) { stStat('Falta la clave de AssemblyAI (arriba).','err'); $('stKeys').style.display='block'; return; }
    if (!stFile) { stStat('Subí un video primero.','err'); return; }
    $('stTranscribe').disabled = true;
    try{
      stStat('<span class="spin"></span>Subiendo el audio…');
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method:'POST', headers:{ 'authorization':key }, body: stFile });
      if(!up.ok) throw new Error('upload '+up.status);
      const { upload_url } = await up.json();
      stStat('<span class="spin"></span>Transcribiendo… (puede tardar)');
      const body = { audio_url: upload_url, language_detection: true, speaker_labels: true };
      const cr = await fetch('https://api.assemblyai.com/v2/transcript', { method:'POST', headers:{ 'authorization':key, 'content-type':'application/json' }, body: JSON.stringify(body) });
      if(!cr.ok) throw new Error('create '+cr.status);
      const job = await cr.json();
      let st = job.status, id = job.id;
      while (st==='queued' || st==='processing'){
        await new Promise(r=>setTimeout(r,3000));
        const pr = await fetch('https://api.assemblyai.com/v2/transcript/'+id, { headers:{ 'authorization':key } });
        const d = await pr.json(); st = d.status; if (d.words) stSubWords = d.words; if (d.error) throw new Error(d.error);
      }
      if (st==='completed'){
        stSubCues = buildCues(stSubWords);
        stStat('Transcripción lista · '+stSubCues.length+' subtítulos.','ok');
        $('stTranslate').disabled = false;
        $('stGo').disabled = false;
      } else throw new Error('estado: '+st);
    }catch(e){ stStat('Falló: '+((e&&e.message)||e),'err'); }
    $('stTranscribe').disabled = false;
  });

  $('stTranslate').addEventListener('click', async () => {
    if (!oaiGet()) { stStat('Falta la clave de OpenAI (arriba).','err'); $('stKeys').style.display='block'; return; }
    if (!stSubCues.length) { stStat('Transcribí primero.','err'); return; }
    $('stTranslate').disabled = true;
    const texts = stSubCues.map(c => (c.text||'').replace(/\s+/g,' ').trim());
    const N = texts.length, BATCH = 24;
    stStat('<span class="spin"></span>Traduciendo… 0/'+N);
    try{
      const result = new Array(N); let done=0, fail=0;
      for (let s=0; s<N; s+=BATCH){
        const slice = texts.slice(s, s+BATCH);
        const ctxPrev = texts[s-1]||'', ctxNext = texts[s+slice.length]||'';
        let tr = null;
        try{ tr = await translateBatch(slice, ctxPrev, ctxNext); }catch(e){ tr=null; }
        for (let i=0;i<slice.length;i++){
          const v = (tr && tr[i]!=null) ? String(tr[i]).replace(/\s+/g,' ').trim() : '';
          if (v) result[s+i]=v; else { result[s+i]=texts[s+i]; fail++; }
        }
        done = Math.min(N, s+slice.length);
        stStat('<span class="spin"></span>Traduciendo… '+done+'/'+N);
      }
      for (let i=0;i<N;i++) stSubCues[i].text = result[i];
      stStat('Traducido al español ✓'+(fail?(' ('+fail+' sin traducir)'):'.'),'ok');
    }catch(e){ stStat('No se pudo traducir: '+((e&&e.message)||e),'err'); }
    $('stTranslate').disabled = false;
  });

  $('stGo').addEventListener('click', () => {
    if (!stSubCues.length || !stFile) { stStat('Transcribí el video antes de continuar.','err'); return; }
    const dur = stDuration || (stSubCues.length ? stSubCues[stSubCues.length-1].end/1000 : 0);
    const payload = {
      video_id: 'oi_' + Date.now().toString(16),
      duration_seconds: +Number(dur).toFixed(2),
      language: 'es',
      transcription_status: 'completed',
      segments: stSubCues.map((c,i) => ({
        segment_id: 'seg_'+String(i+1).padStart(3,'0'),
        start: +(c.start/1000).toFixed(2),
        end: +(c.end/1000).toFixed(2),
        text: (c.text||'').trim(),
        speaker: null,
      })),
    };
    try { renderPlayer({ videoBlob: stFile, payload }); }
    catch (err) { renderError(err); }
  });
}

  function segStat(curveArr, s){
    const pts = curveArr.filter(p => p.t >= s.start && p.t < s.end);
    if (!pts.length) return { cls: 'segBadge-none', label: 'Sin datos' };
    const avg = pts.reduce((a,p) => a + p.v, 0) / pts.length;

  // ---------- Comparar grupos — SIMULADO ----------
  // Diferencias marcadas entre grupos (antes eran demasiado sutiles) y muestreo
  // interpolado entre puntos, para que el movimiento de las barras sea fluido
  // en vez de saltar entre valores fijos.
  function seededRand(seed){ let s = seed; return () => { s = (s*9301+49297) % 233280; return s/233280; }; }
  function genGroupCurve(seed, bias){
    // aprobación y disgusto son independientes: en un grupo real puede haber
    // gente aprobando y gente rechazando al mismo momento. "bias" solo corre
    // el equilibrio entre las dos, no fuerza a que una sea siempre cero.
    const N = 60; const r = seededRand(seed);
    const posBias = bias > 0 ? Math.min(85, 22 + bias*0.7) : Math.max(6, 20 + bias*0.22);
    const negBias = bias < 0 ? Math.min(85, 22 - bias*0.7) : Math.max(6, 20 - bias*0.22);
    let pv = posBias, nv = negBias; const out = [];
    for (let i=0;i<N;i++){
      pv += (r()-0.5)*16 + (posBias - pv)*0.1; pv = Math.max(0, Math.min(100, pv));
      nv += (r()-0.5)*16 + (negBias - nv)*0.1; nv = Math.max(0, Math.min(100, nv));
      out.push({ pos: pv, neg: nv, v: pv - nv }); // v = neto, para el gráfico y el tinte
    }
    return out;
  }
  function groupSeed(g){ return 50 + (g.sexo||'').length*5 + (g.edad||'').length*7 + (g.zona||'').length*11; }
  function groupBias(g){
    return (g.sexo==='Mujeres'?25:g.sexo==='Hombres'?-20:0)
      + (g.edad==='Menos de 30'?-18:g.edad==='50 o más'?28:0)
      + (g.zona==='CABA'?14:g.zona==='Provincia de Buenos Aires'?-12:0);
  }
  function groupLabel(g, fallback){
    const parts = [g.sexo, g.edad, g.zona].filter(Boolean);
    return parts.length ? parts.join(', ') : fallback;
  }
  function tintFor(vArr){
    const avg = vArr.reduce((a,b)=>a+b,0)/vArr.length;
    if (Math.abs(avg) < 8) return 'var(--field)';
    const a = Math.min(.5, Math.abs(avg)/100*.55);
    return avg > 0 ? `rgba(15,122,82,${a})` : `rgba(161,29,46,${a})`;
  }
  function sampleGroupAt(curveArr, t){
    if (!curveArr.length || !duration) return { pos: 0, neg: 0, v: 0 };
    const N = curveArr.length;
    const pos = Math.max(0, Math.min(N - 1, (t / duration) * (N - 1)));
    const i0 = Math.floor(pos), i1 = Math.min(N - 1, i0 + 1), frac = pos - i0;
    const a = curveArr[i0], b = curveArr[i1];
    return {
      pos: a.pos * (1 - frac) + b.pos * frac,
      neg: a.neg * (1 - frac) + b.neg * frac,
      v: a.v * (1 - frac) + b.v * frac,
    };
  }

  const zeroZonePlugin = {
    id: 'oiZeroZone',
    beforeDatasetsDraw(c){
      const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = c;
      const zeroY = y.getPixelForValue(0);
      ctx.save();
      ctx.fillStyle = 'rgba(15,122,82,0.08)'; ctx.fillRect(left, top, right-left, zeroY-top);
      ctx.fillStyle = 'rgba(161,29,46,0.08)'; ctx.fillRect(left, zeroY, right-left, bottom-zeroY);
      ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(left, zeroY); ctx.lineTo(right, zeroY); ctx.stroke();
      ctx.restore();
    }
  };
  const playheadPlugin = {
    id: 'oiPlayhead',
    afterDatasetsDraw(c){
      if (!duration) return;
      const { ctx, chartArea: { top, bottom }, scales: { x } } = c;
      const idx = (vid.currentTime / duration) * (x.max || 59);
      const px = x.getPixelForValue(idx);
      ctx.save();
      ctx.strokeStyle = '#eb6834'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
      ctx.fillStyle = '#eb6834';
      ctx.beginPath(); ctx.arc(px, top + 7, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, top + 7, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  };
  const compareChart = new Chart($('oiCompareChart').getContext('2d'), {
    type: 'line', plugins: [zeroZonePlugin, playheadPlugin],
    data: { labels: Array.from({length:60},(_,i)=>i), datasets: [
      { data: [], borderColor: '#2a78d6', borderWidth: 2, pointRadius: 0, tension: .3 },
      { data: [], borderColor: '#6250d6', borderWidth: 2, pointRadius: 0, tension: .3 },
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { min: -100, max: 100, ticks: { color: '#9aa0a6' }, grid: { color: '#e6e6e6' } }, x: { display: false } },
    },
  });
  vid.addEventListener('timeupdate', () => { if (compareChart) compareChart.update('none'); });

  function readGroup(prefix){
    return { sexo: $(prefix+'Sexo').value, edad: $(prefix+'Edad').value, zona: $(prefix+'Zona').value };
  }
  function personalAsGroupCurve(){
    const N = 60; const out = [];
    for (let i=0;i<N;i++){
      const t = (i/(N-1)) * (duration || 1);
      const v = sampleCurveAt(curve, t);
      out.push({ pos: Math.max(0, v), neg: Math.max(0, -v), v });
    }
    return out;
  }
  function updateCompare(){
    const compareOn = $('oiCompareOn').checked;
    const gaUseYo = $('gaUseYo').checked, gbUseYo = $('gbUseYo').checked;
    $('gaSelects').style.display = gaUseYo ? 'none' : '';
    $('gbSelects').style.display = gbUseYo ? 'none' : '';
    $('oiGroupBBox').style.display = compareOn ? '' : 'none';
    if ($('oiSegsBCol')) $('oiSegsBCol').style.display = compareOn ? '' : 'none';
    if (mode === 'explore') $('oiVuLeftWrap').style.display = compareOn ? 'flex' : 'none';
    document.getElementById('cumWrapL').classList.toggle('on', mode === 'explore' && compareOn);
    document.getElementById('cumWrapR').classList.toggle('on', mode === 'explore');

    const gA = readGroup('ga'), gB = readGroup('gb');
    curveA = gaUseYo ? personalAsGroupCurve() : genGroupCurve(groupSeed(gA), groupBias(gA));
    curveB = gbUseYo ? personalAsGroupCurve() : genGroupCurve(groupSeed(gB)+1, groupBias(gB));
    compareChart.data.datasets[0].data = curveA.map(p => p.v);
    compareChart.data.datasets[1].data = compareOn ? curveB.map(p => p.v) : [];
    compareChart.update();
    const labelA = gaUseYo ? 'Vos' : groupLabel(gA, 'Grupo A (todos)');
    const labelB = gbUseYo ? 'Vos' : groupLabel(gB, 'Grupo B (todos)');
    $('oiCompareTitle').textContent = compareOn ? (labelA + ' vs ' + labelB) : labelA;
    $('oiVuLeftLabel').textContent = labelA;
    $('oiVuLeftLabel').style.color = '#2a78d6';
    $('oiVuRightLabel').textContent = compareOn ? labelB : labelA;
    $('oiVuRightLabel').style.color = compareOn ? '#6250d6' : '#2a78d6';
    $('oiTintA').style.background = tintFor(curveA.map(p => p.v));
    $('oiTintB').style.background = compareOn ? tintFor(curveB.map(p => p.v)) : 'var(--field)';
    if (segs.length && $('oiSegsA')) {
      const ptsA = curveA.map((p, i) => ({ t: (i / curveA.length) * duration, v: p.v }));
      $('oiSegsA').innerHTML = buildSegListHTML(ptsA);
      wireSegList($('oiSegsA'));
      if (compareOn) {
        const ptsB = curveB.map((p, i) => ({ t: (i / curveB.length) * duration, v: p.v }));
        $('oiSegsB').innerHTML = buildSegListHTML(ptsB);
        wireSegList($('oiSegsB'));
      }
    }
  }
  ['gaSexo','gaEdad','gaZona','gbSexo','gbEdad','gbZona','gaUseYo','gbUseYo'].forEach(id => $(id).addEventListener('change', updateCompare));
  $('oiCompareOn').addEventListener('change', updateCompare);
  updateCompare();

  // Arrastrar la línea testigo del gráfico también navega el video, no solo clickear
  let scrubbing = false;
  function seekFromEvent(e){
    if (!duration) return;
    const pos = Chart.helpers.getRelativePosition(e, compareChart);
    const idx = compareChart.scales.x.getValueForPixel(pos.x);
    const t = Math.max(0, Math.min(duration, (idx / 59) * duration));
    vid.currentTime = t;
  }
  const compareCanvas = $('oiCompareChart');
  compareCanvas.style.cursor = 'grab';
  compareCanvas.addEventListener('pointerdown', (e) => { scrubbing = true; compareCanvas.style.cursor = 'grabbing'; seekFromEvent(e); vid.play(); });
  compareCanvas.addEventListener('pointermove', (e) => { if (scrubbing) seekFromEvent(e); });
  window.addEventListener('pointerup', () => { scrubbing = false; compareCanvas.style.cursor = 'grab'; });

  // ---------- Informe con IA (colapsado, con links a los momentos citados) ----------
  function keyGet(){ try{ return localStorage.getItem('vn_oai') || ''; }catch(e){ return ''; } }
  async function gptChat(messages, opts){
    const key = keyGet();
    if (!key) throw new Error('Falta la clave de OpenAI (cargala en Video Note, pestaña Fondos → Crear con IA).');
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'content-type': 'application/json' },
      body: JSON.stringify({ model: (opts && opts.model) || 'gpt-4o', temperature: (opts && opts.temperature != null) ? opts.temperature : 0.5, messages }),
    });
    if (!r.ok) { let m=''; try{ const j=await r.json(); m=(j.error&&j.error.message)||''; }catch(e){} throw new Error('OpenAI ' + r.status + (m ? ' · ' + m : '')); }
    const d = await r.json();
    return (d.choices[0].message.content || '').trim();
  }
  function linkifyReport(text){
    let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n+/g,'<br>');
    segs.forEach((s, i) => {
      const t = s.text.trim();
      if (t.length < 6) return;
      const at = html.indexOf(t);
      if (at === -1) return;
      const link = `<a href="#" data-i="${i}">"${t}"</a>`;
      html = html.slice(0, at) + link + html.slice(at + t.length);
    });
    return '<p>' + html + '</p>';
  }
  $('oiReportBtn').addEventListener('click', async () => {
    const out = $('oiReportOut');
    if (!segs.length) { out.textContent = 'No hay transcripción para armar el informe.'; return; }
    $('oiReportBtn').disabled = true;
    out.textContent = 'Generando…';
    const compareOn = $('oiCompareOn').checked;
    const gA = readGroup('ga'), gB = readGroup('gb');
    const labelA = $('gaUseYo').checked ? 'vos' : groupLabel(gA, 'el grupo A');
    const labelB = $('gbUseYo').checked ? 'vos' : groupLabel(gB, 'el grupo B');
    const rows = segs.map((s) => {
      const a = segStat(curveA.map((p,j)=>({t:(j/curveA.length)*duration, v:p.v})), s);
      const b = compareOn ? segStat(curveB.map((p,j)=>({t:(j/curveB.length)*duration, v:p.v})), s) : null;
      return `- "${s.text.trim()}" → ${labelA}: ${a.label}` + (b ? ` · ${labelB}: ${b.label}` : '');
    }).join('\n');
    try {
      const res = await gptChat([
        { role: 'system', content: 'Sos un analista de opinión pública. Con estos datos simulados de reacción por frase, escribí un informe breve (4 a 6 frases) en español rioplatense, destacando contrastes entre los grupos. Citá 2 o 3 frases EXACTAS entre comillas, tal cual te las paso (no las parafrasees), junto con su porcentaje.' },
        { role: 'user', content: rows },
      ]);
      out.innerHTML = linkifyReport(res);
      out.querySelectorAll('a[data-i]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          playAsQuote(segs[Number(a.dataset.i)]);
        });
      });
    } catch (e) {
      out.textContent = 'No se pudo generar: ' + ((e && e.message) || e);
    }
    $('oiReportBtn').disabled = false;
  });

  setMode('vote');
}

function renderError(err){
  wrap.innerHTML = `
    <div class="card"><div class="body">
      <div class="empty" style="color:#a11d2e;text-align:left">
        <b>Se rompió algo al armar la página.</b><br><br>
        Mandale esto a Claude tal cual (captura o copiado):<br><br>
        <code style="display:block;background:var(--field);padding:10px;border-radius:6px;margin-top:6px;white-space:pre-wrap;font-family:var(--mono);font-size:11.5px">${String((err && err.stack) || err)}</code>
      </div>
    </div></div>`;
}

const forzarNuevo = new URLSearchParams(location.search).has('nuevo');
if (forzarNuevo) {
  renderEmpty();
} else {
  loadHandoff().then(entry => {
    if (!entry || !entry.videoBlob) { renderEmpty(); return; }
    try {
      renderPlayer(entry);
    } catch (err) {
      renderError(err);
    }
  }).catch(err => renderError(err));
}
</script>
